# Trial: paper P15 (Menne & Williams 2009, pairwise homogenization) applied to our station
# switches: replication step 8. Card: papers/2009_menne_pairwise_homogenization/README.md
# Run:     uv run proto-star climate-trial configs/agent_paper_station_p15.yaml --record
# Why:     uv run python scripts/analyze_station_p15.py
# Package: uv run proto-star climate-package configs/agent_paper_station_p15.yaml
# Folds are fixed by ADR 0004 (cut-offs 1980, 1995, 2011) and cannot be set here.
# The 9 station variants below were fixed before the first run. All are kept as the record.
name: station_p15
description: >
  Levels from the current station segment only (capped at the current_best window, with a
  fallback to the full window when the segment is short), or window means after adjusting
  earlier station segments by a pairwise neighbor step estimate (P15): the change in the
  city-minus-neighbors difference series across each station switch inside the window.
  Neighbors are the nearest cities without a switch of their own around it. Data up to the
  cut-off only. References: current_best, ten_year_mean and the submitted hybrid_ridge_all_cdd.

forecasters:
  - current_best          # reference: 10y mean for temperature/CDD, 30y mean for precip/hottest day
  - ten_year_mean
  - hybrid_ridge_all_cdd  # submitted (ADR 0005): pooled ridge for CDD, current_best for the rest
  # Current station segment only
  - seg_temp_cdd
  - seg_temp_cdd_min3
  - seg_temp_cdd_cap15
  - seg_all_min10
  # Pairwise neighbor step adjustment (P15)
  - adj_temp_cdd_k5_w5
  - adj_temp_cdd_k10_w10
  - adj_temp_cdd_k5_w5_t2
  - adj_all_k5_w10
  # Adjusted temperature on top of the submitted pooled ridge CDD
  - adj_temp_k5_w5_ridge_cdd

variants:
  hybrid_ridge_all_cdd:   # copied from configs/agent_paper_p09_p14_pooled.yaml
    forecaster: pooled_hybrid_p09_p14
    params: {model_metrics: [cdd], estimator: ridge, alpha: 1.0, train_years: null}
  seg_temp_cdd:
    forecaster: station_p15
    params: {mode: segment, metrics: [annual_avg_temp, cdd], min_years: 5}
  seg_temp_cdd_min3:
    forecaster: station_p15
    params: {mode: segment, metrics: [annual_avg_temp, cdd], min_years: 3}
  seg_temp_cdd_cap15:
    forecaster: station_p15
    params:
      mode: segment
      metrics: [annual_avg_temp, cdd]
      windows: {annual_avg_temp: 15, cdd: 15}
      min_years: 5
  seg_all_min10:
    forecaster: station_p15
    params: {mode: segment, metrics: [annual_avg_temp, total_precip_in, hottest_day_temp, cdd], min_years: 10}
  adj_temp_cdd_k5_w5:
    forecaster: station_p15
    params: {mode: adjusted, metrics: [annual_avg_temp, cdd], n_neighbors: 5, side_years: 5, min_side_years: 3, max_km: 1000.0, min_t: 0.0}
  adj_temp_cdd_k10_w10:
    forecaster: station_p15
    params: {mode: adjusted, metrics: [annual_avg_temp, cdd], n_neighbors: 10, side_years: 10, min_side_years: 3, max_km: 1000.0, min_t: 0.0}
  adj_temp_cdd_k5_w5_t2:
    forecaster: station_p15
    params: {mode: adjusted, metrics: [annual_avg_temp, cdd], n_neighbors: 5, side_years: 5, min_side_years: 3, max_km: 1000.0, min_t: 2.0}
  adj_all_k5_w10:
    forecaster: station_p15
    params: {mode: adjusted, metrics: [annual_avg_temp, total_precip_in, hottest_day_temp, cdd], n_neighbors: 5, side_years: 10, min_side_years: 3, max_km: 1000.0, min_t: 0.0}
  adj_temp_k5_w5_ridge_cdd:
    forecaster: station_p15
    params:
      mode: adjusted
      metrics: [annual_avg_temp]
      n_neighbors: 5
      side_years: 5
      min_side_years: 3
      max_km: 1000.0
      min_t: 0.0
      base_forecaster: pooled_hybrid_p09_p14
      base_params: {model_metrics: [cdd], estimator: ridge, alpha: 1.0, train_years: null}

reference: current_best
# Chosen from this trial's backtest only (never leaderboard scores). No station variant beats
# hybrid_ridge_all_cdd: the best, adj_temp_k5_w5_ridge_cdd, is 3.61 / 0.97 / 5.53 (all / years
# 1-3 / years 4-7) vs 3.60 / 0.94 / 5.54 and wins 2/3 origins in each window. The best P15-only
# variants add +0.07 to +0.09 over current_best, from the few cities with a switch in the window.
submit: hybrid_ridge_all_cdd
