# City-relative drift correction on the final-round winner (r4_winners).
# Run:    uv run proto-star climate-trial configs/at_city_drift.yaml --record
# Check:  uv run python scripts/robustness_origins.py configs/at_city_drift.yaml \
#           --origins rolling27 --default r4_winners --out runs/robustness/city_drift
# Paired: uv run python scripts/paired_bootstrap.py configs/at_city_drift.yaml --default r4_winners
# Folds are fixed by ADR 0004 (cut-offs 1980, 1995, 2011) and cannot be set here.
#
# IDEA (from comparing this team's trials with PstarAlu and DragonDare): quantities that are
# specific to a city are too noisy when measured from the city's own record, because weather
# shared with its region dominates. Measured against its nearest neighbours, the shared
# weather cancels and what is left is station drift. E2 (agent/hypothesis-trials) used the
# national mean as the reference and one 15-year window; this uses the 10 nearest cities and
# five windows, with a robust fit and separate coefficients for leads 1-3 and 4-7.
#
# CANDIDATES. All four were written here before any of them ran on any fold. No smoke test on
# real data preceded this file. Settings are DragonDare's published ones (10 neighbours,
# windows 1/3/5/10/15), not tuned here.
#   cd1_temp_cdd      temperature and CDD, neighbours, lead groups 1-3 and 4-7 (primary)
#   cd2_one_group     cd1 with one coefficient set for all leads
#   cd3_national      cd1 with the national mean as the reference (control: is "neighbours"
#                     the active ingredient?)
#   cd4_all_metrics   cd1 extended to precipitation and the hottest day
#
# SELECTION RULE: the final round's rule (proto_star.robustness.apply_selection_rule), with
# r4_winners as the default and raw_score on window "all" (ADR 0009). A candidate replaces
# r4_winners only if all three hold:
#   1. its mean raw score on the official folds is higher than r4_winners';
#   2. its mean raw score over the 27 rolling origins (1985-2011) is higher;
#   3. it beats r4_winners at >= 60% of the 27 origins.
# If more than one passes, choose the one with the highest 27-origin mean. The paired
# year-block bootstrap interval is reported next to it. Whether to submit is the human's call.
# No leaderboard score and no 2019-2025 data is used for any choice.
name: city_drift
description: >
  The final-round winner plus a robust, city-relative correction learned in-fold from each
  city's drift against its nearest neighbours. Compared with r4_winners.

forecasters:
  - thirty_year_mean
  - r2_lead_split3
  - r4_winners
  - cd1_temp_cdd
  - cd2_one_group
  - cd3_national
  - cd4_all_metrics

models:
  r2_lead_split3: {kind: lead_blend, params: {}}
  # Copied verbatim from configs/mp_final_round.yaml (r4_winners).
  r4_winners: &r4
    kind: swap_metric
    params:
      metric: hottest_day_temp
      base:
        kind: swap_metric
        params:
          metric: total_precip_in
          base: {kind: lead_blend, params: {}}
          components:
            - {kind: final_precip_nudge, params: {k: 31, recent_years: 10, fraction: 0.3, window: 30, min_years: 10}}
            - {kind: final_precip_two_half, params: {fay_herriot: true, window: 30, long_window: 45, early_leads: 3, min_days: 360, min_valid: 10, min_complete: 10, min_complete_long: 15, median_shrink: 0.5, bandwidth_km: 300.0, record_years: 90, fh_min_window_years: 15, fh_min_record_years: 30, fh_min_kernel_weight: 0.5}}
      components:
        - {kind: final_hottest_nudge, params: {k: 31, recent_years: 10, fraction: 0.3, window: 30, min_years: 10}}
        - {kind: final_hottest_second_high, params: {window: 30, min_days: 360, min_complete: 10, bandwidth_km: 300.0}}

  cd1_temp_cdd:
    kind: city_drift
    params: {base: *r4, metrics: [annual_avg_temp, cdd], reference: neighbors, k: 10, windows: [1, 3, 5, 10, 15], lead_groups: [[1, 3], [4, 7]], pseudo_origins: 30, epsilon: 1.35, alpha: 0.0001, shrink: 1.0}
  cd2_one_group:
    kind: city_drift
    params: {base: *r4, metrics: [annual_avg_temp, cdd], reference: neighbors, k: 10, windows: [1, 3, 5, 10, 15], lead_groups: [[1, 7]], pseudo_origins: 30, epsilon: 1.35, alpha: 0.0001, shrink: 1.0}
  cd3_national:
    kind: city_drift
    params: {base: *r4, metrics: [annual_avg_temp, cdd], reference: national, k: 10, windows: [1, 3, 5, 10, 15], lead_groups: [[1, 3], [4, 7]], pseudo_origins: 30, epsilon: 1.35, alpha: 0.0001, shrink: 1.0}
  cd4_all_metrics:
    kind: city_drift
    params: {base: *r4, metrics: [annual_avg_temp, cdd, total_precip_in, hottest_day_temp], reference: neighbors, k: 10, windows: [1, 3, 5, 10, 15], lead_groups: [[1, 3], [4, 7]], pseudo_origins: 30, epsilon: 1.35, alpha: 0.0001, shrink: 1.0}

reference: thirty_year_mean
submit: r4_winners
