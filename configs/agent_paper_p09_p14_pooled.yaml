# Trial: papers P14 (Montero-Manso & Hyndman 2021, global/pooled models) and P09 (median /
# quantile regression). Card: papers/2021_montero-manso_global_pooled/README.md
# Run:    OMP_NUM_THREADS=5 uv run proto-star climate-trial configs/agent_paper_p09_p14_pooled.yaml --record
# Package: uv run proto-star climate-package configs/agent_paper_p09_p14_pooled.yaml
# Folds are fixed by ADR 0004 (cut-offs 1980, 1995, 2011) and cannot be set here.
# Every variant below was compared, including the ones that lost (kept as the record).
name: paper_p09_p14_pooled
description: >
  One model pooled across all 210 cities, per metric (or across metrics), on per-series
  normalized lags and trailing means plus Lat/Lon/region, direct multi-horizon for leads 1-7.
  Median (pinball 0.5) linear and boosted variants, with a squared-loss ridge ablation, and
  per-metric hybrids that use the pooled model for CDD only.

forecasters:
  - current_best          # reference: 10y mean for temperature/CDD, 30y mean for precip/hottest day
  - ten_year_mean
  # P14 + P09: global linear median AR, one model per lead
  - pooled_ql
  - pooled_ql_lags20
  - pooled_ql_all_history
  # P14 with squared loss (as in the paper): ridge ablation of the median objective
  - pooled_ridge
  - pooled_ridge_all_history
  - pooled_ridge_all_alpha100
  - pooled_ridge_all_lags20
  - pooled_ridge_all_nostatic
  - pooled_ridge_pool_metrics
  # P09: gradient boosting with quantile loss, lead as a feature
  - pooled_hgb
  - pooled_hgb_pool_metrics
  - pooled_hgb_all_pool_metrics
  # Per-metric hybrids: pooled model for CDD, current_best for the other metrics
  - hybrid_ql_cdd
  - hybrid_ql_all_cdd
  - hybrid_ridge_all_cdd

variants:
  pooled_ql:
    forecaster: pooled_median_p09_p14
    params: {estimator: quantile_linear, quantile: 0.5, alpha: 0.0, n_lags: 10, train_years: 60}
  pooled_ql_lags20:
    forecaster: pooled_median_p09_p14
    params: {estimator: quantile_linear, quantile: 0.5, n_lags: 20, train_years: 60}
  pooled_ql_all_history:
    forecaster: pooled_median_p09_p14
    params: {estimator: quantile_linear, quantile: 0.5, train_years: null, origin_stride: 2}
  pooled_ridge:
    forecaster: pooled_median_p09_p14
    params: {estimator: ridge, alpha: 1.0, train_years: 60}
  pooled_ridge_all_history:
    forecaster: pooled_median_p09_p14
    params: {estimator: ridge, alpha: 1.0, train_years: null}
  pooled_ridge_all_alpha100:
    forecaster: pooled_median_p09_p14
    params: {estimator: ridge, alpha: 100.0, train_years: null}
  pooled_ridge_all_lags20:
    forecaster: pooled_median_p09_p14
    params: {estimator: ridge, alpha: 1.0, train_years: null, n_lags: 20}
  pooled_ridge_all_nostatic:
    forecaster: pooled_median_p09_p14
    params: {estimator: ridge, alpha: 1.0, train_years: null, use_static: false}
  pooled_ridge_pool_metrics:
    forecaster: pooled_median_p09_p14
    params: {estimator: ridge, alpha: 1.0, train_years: 60, pool_metrics: true}
  pooled_hgb:
    forecaster: pooled_median_p09_p14
    params:
      estimator: hgb_quantile
      quantile: 0.5
      per_lead: false
      train_years: 60
      seed: 0
      hgb: {max_iter: 300, learning_rate: 0.05, max_leaf_nodes: 15, min_samples_leaf: 100}
  pooled_hgb_pool_metrics:
    forecaster: pooled_median_p09_p14
    params:
      estimator: hgb_quantile
      quantile: 0.5
      per_lead: false
      pool_metrics: true
      train_years: 60
      seed: 0
      hgb: {max_iter: 300, learning_rate: 0.05, max_leaf_nodes: 15, min_samples_leaf: 100}
  pooled_hgb_all_pool_metrics:
    forecaster: pooled_median_p09_p14
    params:
      estimator: hgb_quantile
      quantile: 0.5
      per_lead: false
      pool_metrics: true
      train_years: null
      seed: 0
      hgb: {max_iter: 200, learning_rate: 0.05, max_leaf_nodes: 7, min_samples_leaf: 200}
  hybrid_ql_cdd:
    forecaster: pooled_hybrid_p09_p14
    params: {model_metrics: [cdd], estimator: quantile_linear, quantile: 0.5, train_years: 60}
  hybrid_ql_all_cdd:
    forecaster: pooled_hybrid_p09_p14
    params:
      model_metrics: [cdd]
      estimator: quantile_linear
      quantile: 0.5
      train_years: null
      origin_stride: 2
  hybrid_ridge_all_cdd:
    forecaster: pooled_hybrid_p09_p14
    params: {model_metrics: [cdd], estimator: ridge, alpha: 1.0, train_years: null}

reference: current_best
# Chosen from this trial's backtest only (never leaderboard scores). hybrid_ridge_all_cdd has a mean
# raw score of 3.60 / 0.94 / 5.54 (all / years 1-3 / years 4-7) vs current_best 2.92 / 0.63 / 4.68,
# and beats it at 3/3, 2/3 and 3/3 origins. The pooled model only helped CDD. The pure median
# (pinball 0.5) variants lost to it.
submit: hybrid_ridge_all_cdd
