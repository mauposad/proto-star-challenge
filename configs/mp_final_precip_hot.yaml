# Final round, agent P: precipitation and hottest-day components (branch agent/final-precip-hot).
# Run:    uv run proto-star climate-trial configs/mp_final_precip_hot.yaml --record
# Check:  uv run python scripts/robustness_origins.py configs/mp_final_precip_hot.yaml \
#           --origins rolling27 --default p0_lead_split3 --out runs/robustness/final_precip_hot
# Folds are fixed by ADR 0004 (cut-offs 1980, 1995, 2011) and cannot be set here.
#
# PRE-REGISTERED CANDIDATES (fixed before any run; none may be added after results are seen).
# P rows replace total_precip_in only, H rows hottest_day_temp only (kind swap_metric, base
# lead_split3); the other metrics must stay identical to the default (metric-isolation test).
# The default for both metrics is lead_split3 itself (30-year mean), named p0_lead_split3;
# H0 is the same forecaster, so it is not listed twice.
#   p0_lead_split3   P0/H0 default: 30-year mean
#   p1_nudge         P1  Tatakae: 30-year mean x (1 + 0.3 x mean ratio departure over the last 10
#                        years from the 31 nearest neighbors, each vs its own 30-year mean)
#   p2_two_half      P2  PstarAlu: 0.5 x shrunk 30-year median + 0.5 x complete-year mean
#                        (30 years for leads 1-3, 45 for leads 4-7 if >= 10 / >= 15 complete
#                        years; else 30)
#   p3_two_half_fh   P3  PstarAlu: P2 + Fay-Herriot local shrinkage in leads 4-7 (300 km
#                        leave-one-out Gaussian kernel, tau^2 by method of moments, floor 0,
#                        sparse fallback = no change)
#   p4_crm_eb        P4  ours: CRM regional_eb precipitation level
#   p5_mean_p1_p3    P5  equal-weight mean of P1 and P3
#   h1_nudge         H1  Tatakae: 30-year mean + 0.3 x mean departure over the last 10 years
#                        from the 31 nearest neighbors
#   h2_second_high   H2  PstarAlu: level of the second-highest daily maximum (30-year window,
#                        complete years) + tail spacing pooled with nearby cities
#   h3_crm_eb        H3  ours: CRM regional_eb hottest-day level
#   h4_mean_h1_h2    H4  equal-weight mean of H1 and H2
# NOT RUN by design: PstarAlu's precipitation harmonic, hottest-day summer-state term and
# years 1-3 residual layer (many fitted parameters; their own audit shows negative long-span
# skill for the summer-state term).
#
# SELECTION RULE (final round, Section 4). Written into this file before any candidate ran.
# Do not change it after results are seen. Applied in code by
# proto_star.robustness.apply_selection_rule (window "all" = all 7 forecast years, ADR 0009).
# For this metric, a component replaces the default only if all three hold:
#   1. its mean skill on the official folds (1980, 1995, 2011), all 7 years, is higher than the
#      default's;
#   2. its mean skill over the 27 rolling origins (1985-2011), all 7 years, is higher than the
#      default's;
#   3. it beats the default at >= 60% of the 27 origins (paired, same origin).
# If more than one passes, choose the one with the highest mean over the 27 origins. If none
# passes, keep the default. Report years_1_3 and years_4_7 too, but select on "all".
# No leaderboard score and no 2019-2025 data is used for any choice.
name: final_precip_hot
description: >
  Final round, agent P: precipitation and hottest-day components of Tatakae, PstarAlu and the
  CRM; each replaces one metric of lead_split3 only.

forecasters:
  - thirty_year_mean
  - p0_lead_split3
  - p1_nudge
  - p2_two_half
  - p3_two_half_fh
  - p4_crm_eb
  - p5_mean_p1_p3
  - h1_nudge
  - h2_second_high
  - h3_crm_eb
  - h4_mean_h1_h2

models:
  p0_lead_split3: {kind: lead_blend, params: {}}
  p1_nudge:
    kind: swap_metric
    params:
      metric: total_precip_in
      components:
        - {kind: final_precip_nudge, params: {k: 31, recent_years: 10, fraction: 0.3, window: 30, min_years: 10}}
  p2_two_half:
    kind: swap_metric
    params:
      metric: total_precip_in
      components:
        - {kind: final_precip_two_half, params: {fay_herriot: false, window: 30, long_window: 45, early_leads: 3, min_days: 360, min_valid: 10, min_complete: 10, min_complete_long: 15, median_shrink: 0.5, bandwidth_km: 300.0, record_years: 90, fh_min_window_years: 15, fh_min_record_years: 30, fh_min_kernel_weight: 0.5}}
  p3_two_half_fh:
    kind: swap_metric
    params:
      metric: total_precip_in
      components:
        - {kind: final_precip_two_half, params: {fay_herriot: true, window: 30, long_window: 45, early_leads: 3, min_days: 360, min_valid: 10, min_complete: 10, min_complete_long: 15, median_shrink: 0.5, bandwidth_km: 300.0, record_years: 90, fh_min_window_years: 15, fh_min_record_years: 30, fh_min_kernel_weight: 0.5}}
  p4_crm_eb:
    kind: swap_metric
    params:
      metric: total_precip_in
      components:
        - {kind: crm, params: {regions: spectral, n_clusters: 6, flat_level: regional_eb, urban: true}}
  p5_mean_p1_p3:
    kind: swap_metric
    params:
      metric: total_precip_in
      components:
        - {kind: final_precip_nudge, params: {k: 31, recent_years: 10, fraction: 0.3, window: 30, min_years: 10}}
        - {kind: final_precip_two_half, params: {fay_herriot: true, window: 30, long_window: 45, early_leads: 3, min_days: 360, min_valid: 10, min_complete: 10, min_complete_long: 15, median_shrink: 0.5, bandwidth_km: 300.0, record_years: 90, fh_min_window_years: 15, fh_min_record_years: 30, fh_min_kernel_weight: 0.5}}
  h1_nudge:
    kind: swap_metric
    params:
      metric: hottest_day_temp
      components:
        - {kind: final_hottest_nudge, params: {k: 31, recent_years: 10, fraction: 0.3, window: 30, min_years: 10}}
  h2_second_high:
    kind: swap_metric
    params:
      metric: hottest_day_temp
      components:
        - {kind: final_hottest_second_high, params: {window: 30, min_days: 360, min_complete: 10, bandwidth_km: 300.0}}
  h3_crm_eb:
    kind: swap_metric
    params:
      metric: hottest_day_temp
      components:
        - {kind: crm, params: {regions: spectral, n_clusters: 6, flat_level: regional_eb, urban: true}}
  h4_mean_h1_h2:
    kind: swap_metric
    params:
      metric: hottest_day_temp
      components:
        - {kind: final_hottest_nudge, params: {k: 31, recent_years: 10, fraction: 0.3, window: 30, min_years: 10}}
        - {kind: final_hottest_second_high, params: {window: 30, min_days: 360, min_complete: 10, bandwidth_km: 300.0}}

reference: thirty_year_mean
submit: p0_lead_split3
