[project]
name = "proto-star"
version = "0.1.0"
description = "Forecasting extreme weather trends and recommending climate adaptation strategies (CMU OSPO x Hugging Face challenge)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "huggingface-hub>=0.25",
    "datasets>=3.0",
    "python-dotenv>=1.0",
    "statsmodels>=0.15.0",
]

[project.optional-dependencies]
# Deep learning / transformers stack. Heavy, so opt-in: `uv sync --extra hf`
hf = ["torch>=2.4", "transformers>=4.45"]
# Gridded climate data (NetCDF / Zarr). Opt-in: `uv sync --extra geo`
geo = ["xarray>=2024.7", "netcdf4>=1.7", "zarr>=2.18", "dask>=2024.8"]

[project.scripts]
proto-star = "proto_star.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "mypy>=1.11",
    "pandas-stubs",
    "types-PyYAML",
]
notebooks = ["jupyterlab>=4.2", "matplotlib>=3.9", "seaborn>=0.13"]

[tool.uv]
default-groups = ["dev", "notebooks"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proto_star"]

# ---------- Ruff (lint + format) ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "NPY",      # numpy-specific
    "PD",       # pandas-vet
    "RUF",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"notebooks/**" = ["E402", "F401"]

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: tests that download data or train real models"]

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true

# torch comes from the CPU wheel index (no GPU on the team machines; CUDA wheels are ~2.5 GB).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
